name: Build OrangeFox - RMX3085 (nashc)

on:
  workflow_dispatch:
    inputs:
      RELEASE_OR_ARTIFACT:
        description: 'Upload result as GitHub Release or Actions artifact'
        required: true
        default: 'artifact'
        type: choice
        options:
          - artifact
          - release

concurrency:
  group: orangefox-${{ github.ref }}
  cancel-in-progress: true

env:
  FOX_BRANCH: '12.1'
  DEVICE_NAME: 'RMX3085'
  DEVICE_PATH: 'device/realme/RMX3085'
  BUILD_TARGET: 'recovery'
  FOX_BUILD_DEVICE: 'RMX3085'
  OF_MAINTAINER: 'Pradeep Dhibar'
  FOX_MAINTAINER_PATCH_VERSION: '1'
  ALLOW_MISSING_DEPENDENCIES: 'true'
  LC_ALL: 'C'

jobs:
  build:
    name: OrangeFox R12.0_1 A12.1
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free build space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 1

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git "${GITHUB_WORKSPACE}/scripts"
          sudo bash "${GITHUB_WORKSPACE}/scripts/setup/android_build_env.sh"

      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"

          git config --global user.name "Pradeep Dhibar"
          git config --global user.email "pradeepdhibar@users.noreply.github.com"

          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh \
            --branch "${FOX_BRANCH}" \
            --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${FOX_BRANCH}"

      - name: Install current device tree
        shell: bash
        run: |
          FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${FOX_BRANCH}"
          rm -rf "${FOX_ROOT}/${DEVICE_PATH}"
          mkdir -p "$(dirname "${FOX_ROOT}/${DEVICE_PATH}")"
          cp -a "${GITHUB_WORKSPACE}/device-tree" "${FOX_ROOT}/${DEVICE_PATH}"

          echo "Device tree commit:"
          git -C "${GITHUB_WORKSPACE}/device-tree" log -1 --oneline

      - name: Build OrangeFox
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${FOX_BRANCH}"

          # envsetup.sh may return a non-zero status while setting up the shell.
          # GitHub Actions runs bash with -e, so temporarily disable errexit here.
          set +e
          source build/envsetup.sh
          set -e

          export FOX_BUILD_DEVICE="${DEVICE_NAME}"
          export OF_MAINTAINER="Pradeep Dhibar"
          export FOX_MAINTAINER_PATCH_VERSION="1"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          lunch twrp_${DEVICE_NAME}-eng
          mka adbd ${BUILD_TARGET}image

      - name: Verify build output
        shell: bash
        run: |
          OUT="${GITHUB_WORKSPACE}/OrangeFox/fox_${FOX_BRANCH}/out/target/product/${DEVICE_NAME}"

          IMG_COUNT=$(find "${OUT}" -maxdepth 1 -type f -name 'OrangeFox*.img' | wc -l)
          ZIP_COUNT=$(find "${OUT}" -maxdepth 1 -type f -name 'OrangeFox*.zip' | wc -l)

          if [ "${IMG_COUNT}" -eq 0 ]; then
            echo "OrangeFox IMG was not generated."
            exit 1
          fi

          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "OrangeFox ZIP was not generated."
            exit 1
          fi

          cd "${OUT}"
          sha256sum OrangeFox*.img OrangeFox*.zip | tee SHA256SUMS.txt

          echo "BUILD_DATE=$(TZ=Asia/Kolkata date +%Y%m%d-%H%M)" >> "${GITHUB_ENV}"

      - name: Upload build artifact
        if: ${{ github.event.inputs.RELEASE_OR_ARTIFACT == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-RMX3085-${{ env.BUILD_DATE }}
          path: |
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        if: ${{ github.event.inputs.RELEASE_OR_ARTIFACT == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-RMX3085-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: OrangeFox R12.0_1 A12.1 - Realme 8 4G (RMX3085/nashc)
          generate_release_notes: false
          body: |
            Unofficial OrangeFox Recovery for Realme 8 4G (RMX3085 / nashc)

            Maintainer: Pradeep Dhibar
            OrangeFox base: 12.1
            Device tree branch: ${{ github.ref_name }}
            Device tree commit: ${{ github.sha }}

            Tested:
            - Recovery boot
            - Android 16 encrypted /data decryption
            - Internal storage
            - exFAT MicroSD auto-mount/read/write

            SHA256 checksums are included in SHA256SUMS.txt.
          files: |
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
            OrangeFox/fox_${{ env.FOX_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/SHA256SUMS.txt
